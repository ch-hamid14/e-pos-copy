# Deploy admin-web + backend to VPS over SSH.
# Triggers on push to main (relevant paths) or manually via workflow_dispatch.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'admin-web/**'
      - 'backend/**'
      - 'packages/**'
      - 'sync-system/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_PATH: /opt/projects/volt-app
  VITE_API_URL: https://api.volt.madixsoft.com/api

jobs:
  deploy:
    name: Build & deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install admin-web dependencies
        working-directory: admin-web
        run: npm ci

      - name: Build admin-web
        working-directory: admin-web
        run: npm run build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Install & build packages
        working-directory: packages
        run: |
          npm ci
          npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure remote deploy directories
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ env.DEPLOY_PATH }}/admin-web/dist' \
                      '${{ env.DEPLOY_PATH }}/backend' \
                      '${{ env.DEPLOY_PATH }}/packages' \
                      '${{ env.DEPLOY_PATH }}/sync-system'"

      - name: Rsync admin-web dist
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            admin-web/dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/admin-web/dist/"

      - name: Rsync packages
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            --exclude node_modules \
            --exclude .env \
            packages/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/packages/"

      - name: Rsync sync-system
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            --exclude node_modules \
            --exclude test \
            --exclude docs \
            sync-system/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/sync-system/"

      - name: Rsync backend
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            --exclude node_modules \
            --exclude .env \
            --exclude snapshots \
            --exclude vendor \
            --exclude src \
            backend/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/backend/"

      - name: Remote install, migrate, restart
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" <<REMOTE
          set -euo pipefail
          # Non-interactive SSH does not load ~/.bashrc — source nvm explicitly.
          export NVM_DIR="\$HOME/.nvm"
          if [ -s "\$NVM_DIR/nvm.sh" ]; then
            . "\$NVM_DIR/nvm.sh"
          elif [ -s /usr/local/nvm/nvm.sh ]; then
            . /usr/local/nvm/nvm.sh
          else
            echo "nvm not found (\$NVM_DIR/nvm.sh); install Node or source nvm for this user"
            exit 1
          fi
          nvm use default >/dev/null
          command -v npm >/dev/null || { echo "npm still not on PATH after nvm"; exit 1; }

          cd "${{ env.DEPLOY_PATH }}/packages"
          npm ci
          npm run build

          cd "${{ env.DEPLOY_PATH }}/backend"
          npm ci
          npm run migrate

          if command -v pm2 >/dev/null 2>&1; then
            if pm2 describe volt-backend >/dev/null 2>&1; then
              pm2 reload volt-backend
            else
              pm2 start dist/index.js --name volt-backend
            fi
          else
            echo "pm2 not found — start dist/index.js with your process manager"
            exit 1
          fi
          REMOTE

      - name: Smoke test
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<REMOTE
          set -euo pipefail
          for i in \$(seq 1 30); do
            if curl -fsS http://127.0.0.1:4020/health; then
              echo ""
              echo "health ok (attempt \$i)"
              exit 0
            fi
            sleep 1
          done
          echo "health check failed after 30s"
          export NVM_DIR="\$HOME/.nvm"
          if [ -s "\$NVM_DIR/nvm.sh" ]; then
            . "\$NVM_DIR/nvm.sh"
            nvm use default >/dev/null 2>&1 || true
          fi
          pm2 describe volt-backend || true
          pm2 logs volt-backend --nostream --lines 50 || true
          exit 1
          REMOTE
